<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Palette</title>
    <link rel="stylesheet" href="./palette.css" />
    <script src="./palette.js" defer></script>
  </head>
  <body>
    <main id="root" hidden>
      <header>
        <strong id="title"></strong>
        <button class="manage" type="button" hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6" />
          </svg>
        </button>
      </header>
      <div class="choices">
        <p id="empty" hidden></p>
        <div id="rows" hidden></div>
      </div>
      <footer>
        <button class="resize-handle" type="button" tabindex="-1">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5 13 13 5M10 13l3-3" />
          </svg>
        </button>
      </footer>
    </main>
  </body>
</html>
